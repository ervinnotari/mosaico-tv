#
# Tests and WebAssembly build on every push and pull request.
# The end-to-end test needs the TV on the local network and runs manually
# (scripts\test-tv.bat).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-tests:
    name: JavaScript tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test "tests/js/*.test.js"

  cpp-tests:
    name: C++ tests (native)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/ci/cpp-tests.sh

  wasm-build:
    name: WebAssembly build (Samsung Emscripten)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # OpenH264 (wasm/third_party/openh264) is a git submodule.
          submodules: true

      # Emscripten 1.39 (2019) needs distutils (removed in Python 3.12) and
      # its clang needs libxml2.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install libxml2
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2

      - name: Cache Samsung Emscripten SDK
        uses: actions/cache@v6
        with:
          path: ~/samsung-emsdk
          key: samsung-emsdk-1.39.4.7-linux64

      - name: Set up Samsung Emscripten SDK
        id: emsdk
        run: echo "path=$(sh scripts/ci/setup-emsdk.sh "$HOME/samsung-emsdk")" >> "$GITHUB_OUTPUT"

      - name: Cache OpenH264 build
        uses: actions/cache@v6
        with:
          path: build/openh264/libopenh264dec.a
          key: openh264-${{ runner.os }}-${{ hashFiles('.gitmodules', 'wasm/third_party/openh264/codec/api/wels/codec_ver.h', 'scripts/build.sh') }}

      - name: Build
        run: sh scripts/build.sh
        env:
          SAMSUNG_EMSDK: ${{ steps.emsdk.outputs.path }}

      - uses: actions/upload-artifact@v7
        with:
          name: app-wasm
          path: app/wasm/
          retention-days: 14
