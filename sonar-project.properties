#
# SonarQube Cloud analysis, run by .github/workflows/sonar.yml.
# The organization and project key are passed by the workflow (defaults
# ervinnotari / ervinnotari_mosaico-tv, or the repository variables
# SONAR_ORGANIZATION and SONAR_PROJECT_KEY; see docs/SONAR.md).

sonar.projectName=Mosaico
sonar.sourceEncoding=UTF-8

# App code (JavaScript, CSS, HTML), the C++ player and the tools.
sonar.sources=app,wasm/src,wasm/include,tools,scripts
sonar.tests=tests,wasm/tests
# Generated or third-party code: build outputs, the WASM bundle, the
# licenses copied by the packaging, the decoder sources and signatures.
sonar.exclusions=app/wasm/**,app/licenses/**,app/bench/**,app/*signature*.xml,wasm/third_party/**,build/**,out/**

# Coverage: JavaScript from node --test (lcov), C++ from gcovr (native tests).
sonar.javascript.lcov.reportPaths=build/coverage/lcov.info
sonar.coverageReportPaths=build/coverage/cpp-sonarqube.xml
# Not covered by unit tests on purpose: the screens (app.js), the remote
# control navigation (nav.js) and the code that only runs on the TV (native
# player, WebGL, sockets, discovery, benchmark) are tested end to end on a
# real TV (tools/e2e); tools and scripts are developer utilities.
sonar.coverage.exclusions=app/js/app.js,app/js/nav.js,wasm/src/player_main.cpp,wasm/src/native_player.cpp,wasm/src/soft_decoder.cpp,wasm/src/soft_renderer.cpp,wasm/src/discovery.cpp,wasm/src/bench.cpp,wasm/src/events.cpp,wasm/src/rtsp_connection.cpp,tools/**,scripts/**

# C++: compilation database from build-wrapper around the native test build.
# Files that only build with the Samsung SDK are not in it and are skipped.
sonar.cfamily.compile-commands=build/build-wrapper/compile_commands.json

# Rules that ask for JavaScript newer than the TV browser. The app code
# (app/js) runs unbuilt on Tizen 6.0, whose browser is Chromium 76: no
# optional chaining (Chromium 80), String#replaceAll (85) or Array#at (92).
# Tools and tests run on Node 22 and keep these rules.
sonar.issue.ignore.multicriteria=chain,replaceAll,at
sonar.issue.ignore.multicriteria.chain.ruleKey=javascript:S6582
sonar.issue.ignore.multicriteria.chain.resourceKey=app/js/**
sonar.issue.ignore.multicriteria.replaceAll.ruleKey=javascript:S7781
sonar.issue.ignore.multicriteria.replaceAll.resourceKey=app/js/**
sonar.issue.ignore.multicriteria.at.ruleKey=javascript:S7755
sonar.issue.ignore.multicriteria.at.resourceKey=app/js/**
